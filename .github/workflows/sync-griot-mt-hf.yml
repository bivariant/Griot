name: Sync Griot-MT to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - "models/machine-translation/README.md"
      - "models/machine-translation/assets/**"
      - ".github/workflows/sync-griot-mt-hf.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-griot-mt-huggingface
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Griot-MT Model Card
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Griot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.34.0"

      - name: Verify required source file
        run: |
          test -f models/machine-translation/README.md
          echo "Griot-MT README found."

      - name: Sync Griot-MT README and assets to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          repo_id = "bivariant/griot-mt"
          token = os.environ.get("HF_TOKEN")

          if not token:
              raise RuntimeError(
                  "Missing GitHub Actions secret HF_TOKEN. "
                  "Add it under Settings → Secrets and variables → Actions."
              )

          readme = Path("models/machine-translation/README.md")
          assets = Path("models/machine-translation/assets")

          if not readme.is_file():
              raise FileNotFoundError(readme)

          api = HfApi(token=token)

          identity = api.whoami()
          print("Authenticated to Hugging Face as:", identity.get("name", "<unknown>"))

          # The Hugging Face model repository must already exist.
          api.model_info(repo_id=repo_id)

          # 1) Exact GitHub Griot-MT README -> Hugging Face Model Card.
          api.upload_file(
              repo_id=repo_id,
              repo_type="model",
              path_or_fileobj=str(readme),
              path_in_repo="README.md",
              commit_message="docs: sync Griot-MT model card from GitHub",
          )

          print("README.md synced.")

          # 2) Optional branded assets owned by the MT documentation.
          # This does not touch model weights, tokenizer files, or adapters.
          if assets.is_dir():
              api.upload_folder(
                  repo_id=repo_id,
                  repo_type="model",
                  folder_path=str(assets),
                  path_in_repo="assets",
                  ignore_patterns=[
                      ".DS_Store",
                      "**/.DS_Store",
                      "__pycache__/**",
                      "**/__pycache__/**",
                      "*.pyc",
                  ],
                  commit_message="docs: sync Griot-MT assets from GitHub",
              )
              print("assets/ synced.")
          else:
              print("No models/machine-translation/assets/ directory; skipping assets.")

          remote_files = set(
              api.list_repo_files(
                  repo_id=repo_id,
                  repo_type="model",
              )
          )

          if "README.md" not in remote_files:
              raise RuntimeError("README.md is missing on Hugging Face after sync.")

          print("=" * 72)
          print("GRIOT-MT → HUGGING FACE SYNC: PASS")
          print("=" * 72)
          print("Repository:", f"https://huggingface.co/{repo_id}")
          print("Source    :", readme)
          print("Target    : README.md")
          print("Safety    : no model/adapters deletion operation exists in this workflow")
          PY
